function tampilkanData(data) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="no-data">❌ Tidak ada data yang ditemukan</td></tr>';
        return;
    }
    
    data.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${item.no}</td>
            <td>${item.noAnimo}</td>
            <td><strong>${item.nama}</strong></td>
            <td>${item.ttl}</td>
            <td>${item.jenis}</td>
            <td>${item.koramil}</td>
            <td>${item.babinsa}</td>
            <td>${item.status}</td>
        `;
        tbody.appendChild(row);
    });
}

function cariData() {
    const keyword = document.getElementById('searchInput').value.trim().toUpperCase();
    const resultCount = document.getElementById('resultCount');
    
    if (keyword === '') {
        document.getElementById('tableBody').innerHTML = 
            '<tr><td colspan="8" class="no-data">Mulai ketik nama di atas untuk melihat hasil pencarian</td></tr>';
        resultCount.textContent = 'Silakan ketik nama untuk mencari...';
        resultCount.className = 'result-info';
        return;
    }
    
    const hasil = dataCasis.filter(item => 
        item.nama.toUpperCase().includes(keyword)
    );
    
    tampilkanData(hasil);
    
    if (hasil.length === 0) {
        resultCount.innerHTML = `<span class="error">❌ Tidak ada data dengan nama: "${keyword}"</span>`;
    } else {
        resultCount.innerHTML = `<span class="success">✅ Ditemukan <strong>${hasil.length}</strong> data</span>`;
    }
}
</script>
